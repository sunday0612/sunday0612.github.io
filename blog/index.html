<header class="page-head reveal">
  <p class="eyebrow">归档</p>
  <h1>博客文章</h1>

{% if site.posts.size == 0 %}

{% else %}
  <ol class="post-list">
    {% for post in site.posts %}
      {% include post-item.html heading="h2" %}
    {% endfor %}
  </ol>
{% endif %}
