- id: were-done
  kind: video
  name: "We're Done"
  year: "2026"
  subtitle: "12 秒单镜头短片"
  summary: "一段 12 秒的单镜头 AI 短片。以固定机位和逐秒分镜，记录门口的一次告别。"
  description: "一个固定的门口过肩近景长镜头。门内男人随口招呼“Hey, what's up, babe?”，门外女子停顿片刻，平静地说出“We're done.”，随后转身沿街离开，镜头停在空出的街道上。根据我写的逐秒分镜脚本，用 AI 视频生成制作。"
  url: "/works/were-done/"
  cover: "/assets/images/works/were-done-poster.jpg"
  tags:
    - "短片"
    - "AI 视频"
  media:
    video: "/assets/videos/were-done.mp4"
    poster: "/assets/images/works/were-done-poster.jpg"
  idea: ""
  tools:
    - "AI 视频生成（现有说明只写到这一层，具体模型名称尚未补充）"
  prompt: ""
  storyboard_note: "此处记录创作规划，不代表已逐项核验成片实现。"
  storyboard_rows:
    - shot: "01-A／0–2秒"
      camera: |
        固定过肩近特写。男人右肩虚化压住右侧，女子脸部清晰，浅棕色门框形成两人之间的空间边界。
      action: |
        女子已经站在门外，肩颈放松，身体正对门内。起幅时，她的目光略低于男人眼睛；男人开口后，她抬眼看向他，视线落在镜头右侧近旁，避免直视镜头。嘴角维持极轻笑意，没有迎上前，也没有点头回应。摄影机让观众先感受到男人熟悉的招呼，再注意到她没有接续这种亲密。
      sound: |
        男人从右侧前景方向亲昵、随意地说道：**"Hey, what's up, babe?"** 音色近，属于门内男人的现场声音。BGM低声铺底。
    - shot: "01-B／2–4秒"
      camera: |
        机位、构图不变，焦点稳定停在女子眼睛。
      action: |
        男人说完，她继续看着他，站位和肩膀高度不变。前一秒保持安静；接近第4秒时，嘴唇轻轻分开，完成一次不明显的吸气。她不检查街道、不摆弄包带，也不寻找措辞，用完整的停留让男人等她回应。
      sound: |
        无对白。音乐维持原有节奏，街道环境声轻微可闻。
    - shot: "01-C／4–5秒"
      camera: |
        仍为同一近特写，不推近、不插入反应镜头。
      action: |
        她保持与男人的视线接触，身体不前倾，也不后退，平静地把一句话说完。说到最后一个词时，不加重下巴动作，不用挑眉或笑意扩大制造讽刺。话音结束，嘴唇自然合拢，恢复原有的细微笑意。
      sound: |
        女子简短、清楚、决绝地说道：**"We're done."** BGM保持压低，让每个词清晰落下。
    - shot: "01-D／5–7秒"
      camera: |
        固定镜头继续停留，男人肩背仍没有可见位移。
      action: |
        说完后，她再看男人约半秒，让这句话明确抵达他。随后，眼睛先移向画面左侧的离开方向，下巴再轻轻随过去；双脚暂时不动。到第7秒，她已经停止等待他的回应，但身体仍留在原位。这段停顿让观众看清：她是在结束谈话，而非等待挽留。
      sound: |
        无对白。男人没有回应。音乐保持克制，不在此处突然加强。
    - shot: "01-E／7–9秒"
      camera: |
        摄影机保持原位。女子由正面转为左向侧面，焦点随面部位置轻微调整。
      action: |
        她先将脸转向画面左侧，肩膀和髋部随后转过去，重心移到离开方向，再迈出第一步。披肩长发随转身从肩前向侧后方轻摆，靠近镜头的一侧发丝短暂掠过脸颊，随后落回肩背；不改变发型。包带随身体轻动，仍挂在右肩。到第9秒，她已离开最初正对门口的位置，脸部接近侧后角度，没有回望。
      sound: |
        第一步脚步声轻轻出现。BGM连续，不添加转场音效。
    - shot: "01-F／9–12秒"
      camera: |
        同一固定镜头。女子因走远逐渐缩小，由侧后身转为背影；原先被她遮住的街道自然露出。
      action: |
        她沿街道向画面左侧斜向远处走，步速稳定，双肩没有迟疑性的停顿。背面保持同一件米白上衣，浅棕长发自然垂在肩背，右肩灰色包带仍可辨认。随着距离拉开，画面露出灰黑色沥青路面、白色斑马线与青绿色商铺墙面，远处行人保持模糊、普通的流动。到第11秒左右，她从左侧画边离开；摄影机继续停在门口，保留约一秒空出的街道与右侧静止的男人肩背，再结束。
      sound: |
        无对白，脚步随距离减弱。BGM留在沉默之上，音量不突然抬升。最后一秒让环境底噪与音乐共同承接男人未说出口的反应。
  steps: []
  versions: []

