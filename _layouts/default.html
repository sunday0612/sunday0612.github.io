<!DOCTYPE html>
<html lang="zh-CN">
{% include head.html %}
<body{% if page.body_class %} class="{{ page.body_class | escape }}"{% endif %}>
  <div class="site-backdrop" aria-hidden="true">
    <picture class="site-background">
      <img src="{{ '/assets/images/night-lake.webp' | relative_url }}" srcset="{{ '/assets/images/night-lake-mobile.webp' | relative_url }} 960w, {{ '/assets/images/night-lake.webp' | relative_url }} 1672w" sizes="100vw" width="1672" height="941" alt="" fetchpriority="high" decoding="async">
    </picture>
    <div class="site-atmosphere">
      <div class="hero-glow"></div>
      <div class="hero-mist"></div>
      <div class="hero-water"></div>
    </div>
  </div>
  <a class="skip-link" href="#content">跳到正文</a>
  {% include header.html %}
  <main id="content" class="site-main">
    <div class="wrap">
      {{ content }}
    </div>
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}" defer></script>
</body>
</html>
